# secrets.yaml — as chaves SSH vivem SÓ aqui, nunca na base de dados do painel.
# Copiar para secrets.yaml e preencher. chmod 600.
#
# A chave de cada servidor é o `agent_secret_ref` do painel (ou, se estiver vazio,
# o próprio nome do servidor). Um servidor sem entrada aqui é saltado, e o aviso
# aparece nos logs do painel.

# Chave usada quando um servidor não define key_path próprio.
default_key_path: /opt/backup-agent/keys/ateneya_vps

servers:
  gestao-ateneya-com:
    key_path: /opt/backup-agent/keys/ateneya_vps
    # user e port sobrepõem-se ao painel, se precisares:
    # user: root
    # port: 22

  frutaalvor-com:
    key_path: /opt/backup-agent/keys/ateneya_vps

  # Exemplo com base de dados fora do .env da app (vps_laravel):
  # taxi-codebehind-pt:
  #   key_path: /opt/backup-agent/keys/ateneya_vps
  #   db_override:
  #     host: 127.0.0.1
  #     username: taxi
  #     password: "…"
  #     database: taxi_prod

  # Exemplo com known_hosts próprio (host que muda de chave):
  # loja-amster:
  #   key_path: /opt/backup-agent/keys/ateneya_vps
  #   known_hosts: /opt/backup-agent/keys/known_hosts
